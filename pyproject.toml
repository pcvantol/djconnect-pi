[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "djconnect-pi"
version = "4.0.0rc7"
description = "Raspberry Pi touch display client for DJConnect"
readme = "README.md"
requires-python = ">=3.14.9,<3.15"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "PySide6==6.12.0",
  "requests==2.34.2",
  "websocket-client==1.9.2",
  "zeroconf==0.151.5",
]

[project.optional-dependencies]
dev = [
  "coverage==7.17.0",
  "pytest==9.1.1",
]

[project.scripts]
djconnect-pi-client = "djconnect_pi.app:main"
djconnect-pi-update-ui = "djconnect_pi.update_ui:main"
djconnect-pi-api = "djconnect_pi.client_api_daemon:main"
djconnect-pi-updater = "djconnect_pi.updater:main"
djconnect-pi-maintenance = "djconnect_pi.maintenance:main"
djconnect-pi-watchdog = "djconnect_pi.health_watchdog:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"djconnect_pi.qml" = ["*.qml", "*.js", "*.png", "*.qsb", "*.frag", "qmldir"]
"djconnect_pi" = ["fonts/*.ttf", "fonts/LICENSE.txt"]

[tool.coverage.run]
branch = true
source = ["src/djconnect_pi"]
