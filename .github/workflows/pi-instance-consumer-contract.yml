name: Pi instance consumer contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  software-assurance-governance:
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@dd02d6470f061e6e755e6fb47ae5331c34f89875
    with:
      execution_profile: balanced
      owner: pcvantol/djconnect-pi
  contract:
    needs: software-assurance-governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --only-binary=:all: --requirement Tools/pi_deployment_requirements.lock
      - name: Offline identity and authority counterexamples
        run: |
          python -m pytest tests/test_pi_instance_*.py tests/test_pi_rc6_recovery*.py tests/test_pi_wall4_recovery*.py tests/test_approved_installer.py tests/test_installation_contract.py -q
      - name: Tooling lint
        run: |
          python -m ruff check --no-cache Tools/pi_instance_contract.py Tools/pi_instance_authority.py Tools/pi_instance_ssh.py Tools/pi_instance_remote_payload.py Tools/pi_instance_artifact.py Tools/pi_instance_release.py Tools/pi_instance_aggregate.py Tools/pi_rc6_recovery.py Tools/pi_rc6_recovery_root.py Tools/pi_wall4_recovery*.py
