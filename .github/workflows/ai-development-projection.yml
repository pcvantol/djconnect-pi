name: AI-development projection

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.9"
      - run: python docs/ai-development/validate_projection.py --profile djconnect-pi --source-commit 4a39841a0c85b0e9962c85a74a3fd49d9803c13d --extension-identity DJCONNECT_PI_DEVELOPMENT_EXTENSION
