name: Pi governance migration rehearsal
on:
  push:
    branches: [codex/pi-governance-shared]
permissions:
  contents: read
jobs:
  old-balanced:
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@aabd5de46ae438478eb894707e5b1ea27aca8508
    with:
      execution_profile: balanced
      owner: ${{ github.repository }}
  new-balanced:
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/software-assurance-governance-aabd.yml@b4e6470be61fee895af0e13ca1a63f101f03d647
    with:
      execution_profile: balanced
      owner: ${{ github.repository }}
  old-release:
    uses: pcvantol/djconnect/.github/workflows/software-assurance-governance.yml@aabd5de46ae438478eb894707e5b1ea27aca8508
    with:
      execution_profile: release
      owner: ${{ github.repository }}
  new-release:
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/software-assurance-governance-aabd.yml@b4e6470be61fee895af0e13ca1a63f101f03d647
    with:
      execution_profile: release
      owner: ${{ github.repository }}
