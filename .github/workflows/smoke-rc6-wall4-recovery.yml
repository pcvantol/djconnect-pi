name: Smoke Qualified rc6 Wall4 Recovery

run-name: "Pi recovery smoke / ${{ inputs.deployment_instance }} / ${{ inputs.manifest_id }}"

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options: ["deployment"]
      execution_mode:
        required: true
        type: choice
        options: ["execute"]
      candidate_sha: {required: true, type: string}
      manifest_id: {required: true, type: string}
      artifact_id: {required: true, type: string}
      artifact_sha256: {required: true, type: string}
      target:
        required: true
        type: choice
        options: ["rbpi-djconnect"]
      platform_version:
        required: true
        type: choice
        options: ["4.0"]
      release_profile:
        required: true
        type: choice
        options: ["INTERNAL_RELEASE"]
      deployment_instance:
        required: true
        type: choice
        options: ["wall-4inch"]
      device_profile:
        required: true
        type: choice
        options: ["pi-zero-2w-arm64"]
      inventory_sha256: {required: true, type: string}
      recovery_workflow_run: {required: true, type: string}

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: pi-rc5-mutation-${{ inputs.deployment_instance }}
  cancel-in-progress: false

jobs:
  software-assurance-governance:
    permissions:
      contents: read
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/software-assurance-governance-aabd.yml@2a1c6fd2841b08630aee01402850f56840b50f70
    with:
      execution_profile: release
      owner: ${{ github.repository }}

  instance:
    needs: software-assurance-governance
    # Qualified deployment relay, never a source-build job. Closed existing SSH configuration.
    runs-on: [self-hosted, macOS, ARM64, internal-release, private-network-deployment]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PI_INPUTS_JSON: ${{ toJSON(inputs) }}
      PI_RC6_WALL4_RECOVERY_V3_CORE_SHA: ${{ vars.PI_RC6_WALL4_RECOVERY_V3_CORE_SHA }}
      PI_RC6_WALL4_RECOVERY_V3_MANIFEST_SHA256: ${{ vars.PI_RC6_WALL4_RECOVERY_V3_MANIFEST_SHA256 }}
    steps:
      - name: Checkout exact consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up isolated deployment tooling
        run: |
          /opt/homebrew/bin/python3.14 -I -c 'import sys; assert sys.version_info[:2] == (3, 14)'
          pi_tools_venv="$(mktemp -d "$RUNNER_TEMP/pi-instance-tools.XXXXXXXX")"
          /opt/homebrew/bin/python3.14 -I -m venv "$pi_tools_venv"
          "$pi_tools_venv/bin/python" -I -c 'import sys; assert sys.prefix != sys.base_prefix'
          printf '%s\n' "$pi_tools_venv/bin" >> "$GITHUB_PATH"
      - name: Install exact deployment-tool dependencies
        run: |
          python -m pip --isolated install --no-cache-dir --disable-pip-version-check --no-input --only-binary=:all: --requirement Tools/pi_deployment_requirements.lock
      - name: Require approved operational manifest source
        run: |
          python -m Tools.pi_wall4_recovery_release --operation smoke --prepare
      - name: Require an unused canonical preflight checkout path
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .canonical-core-preflight
          test ! -L .canonical-core-preflight
      - id: canonical_preflight_source
        name: Resolve canonical Core by immutable repository ID
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const expectedId = 1258575431;
            const response = await github.request('GET /repositories/{repository_id}', {repository_id: expectedId});
            const repo = response.data;
            if (repo.id !== expectedId || repo.private !== false || !['pcvantol/djconnect', 'djconnect-music-dj/djconnect'].includes(repo.full_name)) {
              throw new Error('Canonical Core identity is not authorized');
            }
            core.setOutput('repository', repo.full_name);
      - name: Checkout exact canonical preflight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.canonical_preflight_source.outputs.repository }}
          ref: 802619ac1ab3ec11eace7a8609167018193bb98e
          path: .canonical-core-preflight
          persist-credentials: false
      - name: Verify exact canonical preflight bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .canonical-core-preflight rev-parse HEAD)" = 802619ac1ab3ec11eace7a8609167018193bb98e
          printf '%s  %s\n' 8af709b8a6ddf29843562d4f1b09de0747204feb086eeebbb485d16f5423fd37 .canonical-core-preflight/.github/actions/deployment-readiness-preflight/action.yml | shasum -a 256 --check
      - name: Canonical deployment readiness preflight
        uses: ./.canonical-core-preflight/.github/actions/deployment-readiness-preflight
        with:
          target: ${{ inputs.target }}
          manifest_id: ${{ inputs.manifest_id }}
          candidate_sha: ${{ inputs.candidate_sha }}
          artifact_id: ${{ inputs.artifact_id }}
          artifact_sha256: ${{ inputs.artifact_sha256 }}
          expected_runner_os: macOS
          expected_runner_arch: ARM64
          required_configuration: PI_INSTANCE_ENDPOINT_REF,PI_INSTANCE_SSH_CONFIG,GH_TOKEN,PI_RC6_WALL4_RECOVERY_V3_CORE_SHA,PI_RC6_WALL4_RECOVERY_V3_MANIFEST_SHA256
          smoke_contract: pi-rc6-wall4-recovery-readback-v3
      - name: Record successful canonical preflight
        run: |
          echo "PI_CANONICAL_PREFLIGHT_PASSED=true" >> "$GITHUB_ENV"
      - name: Read back exact recovered installation
        run: |
          python -m Tools.pi_wall4_recovery_release --operation smoke
      - name: Preserve redacted instance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pi-wall4-recovery-smoke-evidence
          path: ${{ runner.temp }}/pi-qualified-wall4-recovery-${{ github.run_id }}-1/pi-smoke-evidence.json
          if-no-files-found: warn
      - name: Publish scoped instance decision
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INSTANCE: ${{ inputs.deployment_instance }}
          PHASE_RESULT: ${{ job.status }}
        with:
          script: |
            const sha = process.env.CANDIDATE_SHA; const instance = process.env.INSTANCE;
            if (!/^[0-9a-f]{40}$/.test(sha) || !["wall-4inch", "wall-10inch"].includes(instance)) return;
            const success = process.env.PHASE_RESULT === "success";
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha,
              context: "Deployment / Recovery smoke / " + instance,
              state: success ? "success" : "failure",
              description: success ? "SMOKE_PASS" : "SMOKE_INCONCLUSIVE",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
